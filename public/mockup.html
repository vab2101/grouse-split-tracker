<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Background Position Mockup</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box }
    html, body { height:100%; overflow:hidden; background:#141816; font-family:system-ui,sans-serif; color:#fff }
    #canvas { position:fixed; inset:0; cursor:grab; touch-action:none; }
    #canvas.dragging { cursor:grabbing }
    #ui { position:fixed; inset:0; pointer-events:none }
    .ui-header { position:absolute; top:0; left:0; right:0; padding:16px 24px 12px; background:rgba(20,24,22,0.55); border-bottom:1px solid rgba(255,255,255,0.06); text-align:center; opacity:.4; }
    .ui-timer { font:bold 48px/1 monospace; letter-spacing:-.02em }
    .ui-stats { font-size:12px; color:rgba(255,255,255,.4); margin-top:6px; display:flex; gap:16px; justify-content:center; }
    #ui-progress { position:absolute; left:0; right:0; height:74px; background:rgba(20,24,22,.45); border-bottom:1px solid rgba(255,255,255,.03); display:flex; align-items:center; justify-content:center; opacity:.35; }
    #ui-marker { position:absolute; width:176px; height:176px; border-radius:50%; border:2px solid rgba(80,200,120,.45); background:rgba(80,200,120,.08); left:50%; transform:translate(-50%,-50%); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; opacity:.4; }
    .mnum { font-size:36px; font-weight:700; color:hsl(145,85%,70%); line-height:1 }
    .mlbl { font-size:11px; color:rgba(255,255,255,.45) }
    #ui-footer { position:absolute; bottom:0; left:0; right:0; padding:16px 24px; background:rgba(20,24,22,.55); display:flex; gap:12px; align-items:center; opacity:.4; }
    .ui-finish { flex:1; height:44px; border-radius:8px; background:rgba(220,55,55,.35); display:flex; align-items:center; justify-content:center; gap:8px; font-size:15px; font-weight:600; }
    .ui-lock { width:48px; height:48px; border-radius:50%; background:rgba(255,255,255,.07); display:flex; align-items:center; justify-content:center; }
    #controls { position:fixed; bottom:72px; right:16px; z-index:50; background:rgba(12,16,14,.96); border:1px solid rgba(255,255,255,.1); border-radius:12px; padding:12px 14px; min-width:240px; backdrop-filter:blur(16px); font-size:12px; line-height:1.4; }
    #controls h3 { font-size:10px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:rgba(255,255,255,.3); margin-bottom:10px; }
    .row { display:flex; align-items:center; gap:8px; margin-bottom:7px }
    .lbl { width:54px; font-size:11px; color:rgba(255,255,255,.5); flex-shrink:0 }
    .val { width:60px; text-align:right; font:11px/1 monospace; color:hsl(145,85%,68%); flex-shrink:0 }
    input[type=range] { flex:1; height:3px; appearance:none; -webkit-appearance:none; background:rgba(255,255,255,.15); border-radius:2px; outline:none; cursor:pointer; }
    input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:13px; height:13px; border-radius:50%; background:hsl(145,70%,60%); cursor:pointer; }
    select { width:100%; padding:6px 8px; background:rgba(255,255,255,.06); color:#fff; border:1px solid rgba(255,255,255,.1); border-radius:6px; font-size:12px; }
    .sep { border:none; border-top:1px solid rgba(255,255,255,.07); margin:9px 0 }
    .btn-row { display:flex; gap:8px; margin-bottom:4px }
    .btn { flex:1; padding:7px 0; border-radius:6px; border:none; cursor:pointer; font-size:11px; font-weight:600; }
    #reset { background:rgba(255,255,255,.06); color:rgba(255,255,255,.5) }
    #reset:hover { background:rgba(255,255,255,.12) }
    #copy-btn { background:hsl(145,40%,26%); color:hsl(145,85%,80%) }
    #copy-btn:hover { background:hsl(145,40%,33%) }
    #copied { text-align:center; font-size:10px; color:hsl(145,85%,68%); height:14px; margin-top:3px }
    #toggle-ui { position:fixed; top:12px; right:16px; z-index:50; background:rgba(12,16,14,.9); border:1px solid rgba(255,255,255,.1); border-radius:8px; padding:6px 12px; font-size:11px; color:rgba(255,255,255,.45); cursor:pointer; backdrop-filter:blur(8px); user-select:none; }
    #toggle-ui:hover { color:rgba(255,255,255,.8) }
    #hint { position:fixed; bottom:14px; left:50%; transform:translateX(-50%); background:rgba(12,16,14,.9); border:1px solid rgba(255,255,255,.07); border-radius:8px; padding:5px 14px; font-size:11px; color:rgba(255,255,255,.35); white-space:nowrap; backdrop-filter:blur(8px); pointer-events:none; }

// Per-trail bounds + projection (mirrors trails.ts buildTrail).
// ─────────────────────────────────────────────────────────────────────────────
const LP=0.0008, LG=0.0012, CE=0.009, K=100000;

function makeGeometry(route) {
  const lats = route.map(p=>p[0]);
  const lngs = route.map(p=>p[1]);
  const minLat=Math.min(...lats)-LP, maxLat=Math.max(...lats)+LP;
  const minLng=Math.min(...lngs)-LG, maxLng=Math.max(...lngs)+LG;
  const midLat=(minLat+maxLat)/2, COS=Math.cos(midLat*Math.PI/180);
  const SVG_W=(maxLng-minLng)*COS*K, SVG_H=(maxLat-minLat)*K;
  const CPX=CE*COS*K, CPY=CE*K;
  const CV={x:-CPX, y:-CPY, w:SVG_W+2*CPX, h:SVG_H+2*CPY};
  function project(lng,lat){ return [(lng-minLng)*COS*K, (maxLat-lat)*K]; }
  const pts = route.map(p => project(p[1], p[0]));
  const d = pts.map(([x,y],i)=>`${i?'L':'M'}${x.toFixed(2)} ${y.toFixed(2)}`).join(' ');
  return { SVG_W, SVG_H, CV, pts, d, pivotX: SVG_W/2, pivotY: SVG_H/2 };
}

    <path id="glow" d="${g.d}" fill="none" stroke="hsl(145,70%,55%)" stroke-opacity="0.22" stroke-linecap="round" stroke-linejoin="round"/>
    <path id="line" d="${g.d}" fill="none" stroke="hsl(145,85%,70%)" stroke-opacity="0.6" stroke-linecap="round" stroke-linejoin="round"/>
    <circle id="sdot" cx="${sx.toFixed(2)}" cy="${sy.toFixed(2)}" fill="hsla(45,20%,95%,.9)" stroke="hsl(145,60%,40%)"/>
  `;
}

function render() {
  const w=window.innerWidth, h=window.innerHeight;
  canvas.setAttribute('width', w);
  canvas.setAttribute('height', h);
  canvas.setAttribute('viewBox', `0 0 ${w} ${h}`);

  const p = params[currentTrail];
  const g = GEOM[currentTrail];
  const sc = Math.min(w/g.SVG_W, h/g.SVG_H) * p.ez;
  const tx = (w - g.SVG_W*sc)/2 + p.sx*w;
  const ty = (h - g.SVG_H*sc)/2 + p.sy*h;

  const glow = document.getElementById('glow');
  const line = document.getElementById('line');
  const dot  = document.getElementById('sdot');
  if(glow){ glow.setAttribute('stroke-width',(12/sc).toFixed(3)); glow.style.filter=`blur(${(6/sc).toFixed(2)}px)`; }
  if(line)  line.setAttribute('stroke-width',(3.2/sc).toFixed(3));
  if(dot){ dot.setAttribute('r',(5/sc).toFixed(3)); dot.setAttribute('stroke-width',(2/sc).toFixed(3)); }

  scene.setAttribute('transform',
    `translate(${tx.toFixed(2)} ${ty.toFixed(2)}) scale(${sc.toFixed(6)}) rotate(${p.rot.toFixed(2)} ${g.pivotX.toFixed(2)} ${g.pivotY.toFixed(2)})`
  );

  positionUI(h);
}

function positionUI(h) {
  const hdr  = document.querySelector('.ui-header');
  const hdrH = hdr  ? hdr.getBoundingClientRect().height : 110;
  const prog = document.getElementById('ui-progress');
  if(prog) prog.style.top = hdrH + 'px';
  const progH = prog ? prog.getBoundingClientRect().height : 74;
  const ftr   = document.getElementById('ui-footer');
  const ftrH  = ftr  ? ftr.getBoundingClientRect().height : 76;
  const mk    = document.getElementById('ui-marker');
  if(mk) mk.style.top = (hdrH + progH + (h - hdrH - progH - ftrH)/2) + 'px';
}

function syncSliders() {
  const p = params[currentTrail];
  document.getElementById('sx').value  = p.sx;
  document.getElementById('sy').value  = p.sy;
  document.getElementById('ez').value  = p.ez;
  document.getElementById('rot').value = p.rot;
  updateLabels();
}

function updateLabels() {
  const p = params[currentTrail];
  document.getElementById('sx-v').textContent  = p.sx.toFixed(3);
  document.getElementById('sy-v').textContent  = p.sy.toFixed(3);
  document.getElementById('ez-v').textContent  = p.ez.toFixed(2) + '\xD7';
  document.getElementById('rot-v').textContent = p.rot.toFixed(1) + '\xB0';
  // Update distance hint in stats overlay.
  const distEl = document.getElementById('dist-stat');
  if (distEl) {
    const km = currentTrail === 'bcmc' ? '2.5 km' : '1.8 km';
    distEl.textContent = `↦ 0.00 km / ${km} (0%)`;
  }
}

['sx','sy','ez','rot'].forEach(id => {
  document.getElementById(id).addEventListener('input', () => {
    const p = params[currentTrail];
    p.sx  = +document.getElementById('sx').value;
    p.sy  = +document.getElementById('sy').value;
    p.ez  = +document.getElementById('ez').value;
    p.rot = +document.getElementById('rot').value;
    updateLabels();
    render();
  });
});

document.getElementById('trail').addEventListener('change', e => {
  currentTrail = e.target.value;
  rebuildScene();
  syncSliders();
  render();
});

document.getElementById('reset').addEventListener('click', () => {
  params[currentTrail] = { ...TRAILS[currentTrail].defaults };
  syncSliders(); render();
});

document.getElementById('copy-btn').addEventListener('click', () => {
  const p = params[currentTrail];
  const g = GEOM[currentTrail];
  const exportName = currentTrail === 'bcmc' ? 'BCMC_TRANSFORM' : 'GRIND_TRANSFORM';
  const file = currentTrail === 'bcmc' ? 'trail-data-bcmc.ts' : 'trail-data-grind.ts';
  const code = [
    `// ── Paste into ${file}: export const ${exportName} = {...} ──`,
    `export const ${exportName} = {`,
    `  shiftX: ${p.sx.toFixed(4)},`,
    `  shiftY: ${p.sy.toFixed(4)},`,
    `  extraScale: ${p.ez.toFixed(4)},`,
    `  rotateDeg: ${p.rot.toFixed(2)},`,
    `};`,
    ``,
    `// SVG rotation pivot: (${g.pivotX.toFixed(1)}, ${g.pivotY.toFixed(1)})`,
  ].join('\n');
  navigator.clipboard.writeText(code).then(() => {
    const el = document.getElementById('copied');
    el.textContent = '✓ Copied to clipboard';
    setTimeout(() => { el.textContent = ''; }, 2500);
  }).catch(() => { prompt('Copy these parameters:', code); });
});

// Pointer interactions
const ptrs = new Map();
let dragAnchor = null;
let lastPinch = null;
function pinchDist() {
  const pts = [...ptrs.values()];
  if(pts.length < 2) return null;
  const dx=pts[0].x-pts[1].x, dy=pts[0].y-pts[1].y;
  return Math.sqrt(dx*dx+dy*dy);
}
canvas.addEventListener('pointerdown', e => {
  ptrs.set(e.pointerId, {x:e.clientX, y:e.clientY});
  canvas.setPointerCapture(e.pointerId);
  if(ptrs.size === 1) {
    const p = params[currentTrail];
    dragAnchor = { sx: p.sx, sy: p.sy, px: e.clientX, py: e.clientY };
    canvas.classList.add('dragging');
  } else {
    lastPinch = pinchDist(); dragAnchor = null;
  }
});
canvas.addEventListener('pointermove', e => {
  if(!ptrs.has(e.pointerId)) return;
  ptrs.set(e.pointerId, {x:e.clientX, y:e.clientY});
  const w=window.innerWidth, h=window.innerHeight;
  const p = params[currentTrail];
  if(ptrs.size >= 2) {
    const d = pinchDist();
    if(lastPinch && d) { p.ez = Math.max(0.5, Math.min(3, p.ez * (d / lastPinch))); lastPinch = d; }
    syncSliders(); render();
  } else if(ptrs.size === 1 && dragAnchor) {
    p.sx = dragAnchor.sx + (e.clientX - dragAnchor.px) / w;
    p.sy = dragAnchor.sy + (e.clientY - dragAnchor.py) / h;
    syncSliders(); render();
  }
});
['pointerup','pointercancel'].forEach(ev => {
  canvas.addEventListener(ev, e => {
    ptrs.delete(e.pointerId);
    lastPinch = null;
    if(ptrs.size === 0) { dragAnchor = null; canvas.classList.remove('dragging'); }
    else if(ptrs.size === 1) {
      const [pt] = [...ptrs.values()];
      const p = params[currentTrail];
      dragAnchor = { sx: p.sx, sy: p.sy, px: pt.x, py: pt.y };
    }
  });
});
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const p = params[currentTrail];
  p.ez = Math.max(0.5, Math.min(3, p.ez * (e.deltaY > 0 ? 0.95 : 1.053)));
  syncSliders(); render();
}, {passive:false});

let uiVisible = true;
function toggleUI() {
  uiVisible = !uiVisible;
  document.getElementById('ui').style.display       = uiVisible ? '' : 'none';
  document.getElementById('toggle-ui').textContent  = uiVisible ? 'Hide UI overlay' : 'Show UI overlay';
}

rebuildScene();
syncSliders();
render();
window.addEventListener('resize', render);
</script>
</body>
</html>
